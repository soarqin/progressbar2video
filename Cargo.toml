[workspace]
resolver = "2"
members = [
  "crates/progressbar-schema",
  "crates/progressbar-core",
  "crates/progressbar-renderer",
  "crates/progressbar-encoder",
  "crates/progressbar-api",
  "apps/cli"
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive"] }
cosmic-text = "0.19"
crc32fast = "1.3"
flate2 = "1.0"
png = "0.17"
predicates = "3.1"
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "1.0"
tiny-skia = "0.11"
toml = "0.8"
